# sam deploy defaults. Do not put secrets here.
# Keep this file ASCII-only: SAM CLI on Korean Windows reads it as cp949 and fails on UTF-8 text.
version = 0.1

[default.global.parameters]
stack_name = "csradar"

[default.build.parameters]
template_file = "template.yaml"

[default.deploy.parameters]
region = "us-east-1"            # region allowed in Learner Lab
resolve_s3 = true               # let SAM create the S3 bucket for deploy artifacts
capabilities = "CAPABILITY_IAM"
confirm_changeset = true        # show the change set and ask y/N
