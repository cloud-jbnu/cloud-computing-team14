AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  컴공레이더 서버리스 백엔드 (AWS Academy Learner Lab용).
  Learner Lab은 IAM 역할을 새로 만들 수 없으므로 모든 Lambda가 미리 만들어진 LabRole을 씁니다.

Parameters:
  CrawlSchedule:
    Type: String
    Default: rate(1 hour)
    Description: 크롤러 실행 주기 (예 rate(30 minutes), cron(0 * * * ? *))
  DiscordClientId:
    Type: String
    Description: 디스코드 개발자 포털 → OAuth2의 Client ID
  DiscordClientSecret:
    Type: String
    NoEcho: true
    Description: 디스코드 개발자 포털 → OAuth2의 Client Secret (배포할 때만 넘기고 파일에 적지 않습니다)
  WebOrigin:
    Type: String
    Default: http://localhost:8765
    Description: 웹이 열리는 주소. 로그인 후 여기로 돌아옵니다 (끝에 / 없이)

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 256
    Timeout: 60
    Environment:
      Variables:
        ITEMS_TABLE: !Ref ItemsTable
        SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
        RAW_BUCKET: !Ref RawBucket
  HttpApi:
    CorsConfiguration:
      AllowOrigins: ["*"]
      AllowMethods: [GET, PUT, DELETE, OPTIONS]
      AllowHeaders: [Content-Type, Authorization]
    Auth:
      Authorizers:
        CognitoAuth:                           # 로그인이 필요한 경로에만 붙입니다 (GET /items는 공개)
          IdentitySource: $request.header.Authorization
          JwtConfiguration:
            issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
            audience:
              - !Ref UserPoolClient

Resources:
  # ── 저장소 ─────────────────────────────────────────────
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: category, AttributeType: S }
        - { AttributeName: date, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: category-date-index      # 카테고리별 최신순 조회
          KeySchema:
            - { AttributeName: category, KeyType: HASH }
            - { AttributeName: date, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: keyword, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: keyword, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: keyword-index            # 이 키워드를 구독한 사용자 찾기
          KeySchema:
            - { AttributeName: keyword, KeyType: HASH }
            - { AttributeName: userId, KeyType: RANGE }
          Projection: { ProjectionType: KEYS_ONLY }

  RawBucket:
    Type: AWS::S3::Bucket                      # 원문 HTML 백업
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ── 크롤러 (EventBridge가 주기 실행) ──────────────────
  CrawlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-crawler"
      CodeUri: ../crawler/src
      Handler: handler.lambda_handler
      Timeout: 300
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        Schedule:
          Type: Schedule                       # EventBridge 규칙 (역할 생성 불필요)
          Properties:
            Schedule: !Ref CrawlSchedule

  # ── 웹이 쓰는 목록 API: GET /items ─────────────────────
  ItemsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-items-api"
      CodeUri: ../api/src
      Handler: items.lambda_handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        ListItems:
          Type: HttpApi
          Properties:
            Path: /items
            Method: GET

  # ── 로그인: Cognito User Pool + 디스코드(OIDC) ─────────
  # User Pool은 IAM 역할이 필요 없어서 Learner Lab에서도 만들 수 있습니다.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain         # 로그인 주소: https://<Domain>.auth.<리전>.amazoncognito.com
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "${AWS::StackName}-${AWS::AccountId}"

  DiscordProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Discord
      ProviderType: OIDC
      ProviderDetails:
        client_id: !Ref DiscordClientId
        client_secret: !Ref DiscordClientSecret
        oidc_issuer: https://discord.com       # /.well-known/openid-configuration을 Cognito가 읽어 갑니다
        authorize_scopes: openid identify
        attributes_request_method: GET
      AttributeMapping:
        username: sub                          # 디스코드 사용자 ID → Cognito 사용자 이름 "discord_<ID>"
        preferred_username: preferred_username

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: DiscordProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false                    # 브라우저에서 쓰므로 비밀 값 없이 PKCE로 로그인
      SupportedIdentityProviders: [Discord]    # 디스코드 로그인만 허용
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, profile]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      CallbackURLs:
        - !Sub "${WebOrigin}/"
      LogoutURLs:
        - !Sub "${WebOrigin}/"

  # ── 로그인한 사용자의 키워드 구독: /me/subscriptions ───
  MeApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-me-api"
      CodeUri: ../api/src
      Handler: me.lambda_handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        ListSubscriptions:
          Type: HttpApi
          Properties:
            Path: /me/subscriptions
            Method: GET
            Auth: { Authorizer: CognitoAuth }
        AddSubscription:
          Type: HttpApi
          Properties:
            Path: /me/subscriptions
            Method: PUT
            Auth: { Authorizer: CognitoAuth }
        RemoveSubscription:
          Type: HttpApi
          Properties:
            Path: /me/subscriptions
            Method: DELETE
            Auth: { Authorizer: CognitoAuth }

Outputs:
  ApiUrl:
    Description: web/js/api.js의 API_BASE에 넣을 주소
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  AuthUrl:
    Description: web/js/api.js의 AUTH_BASE에 넣을 주소
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  AuthClientId:
    Description: web/js/api.js의 AUTH_CLIENT_ID에 넣을 값
    Value: !Ref UserPoolClient
  DiscordRedirectUri:
    Description: 디스코드 개발자 포털 → OAuth2 → Redirects에 등록할 주소
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
  ItemsTableName:
    Value: !Ref ItemsTable
  SubscriptionsTableName:
    Value: !Ref SubscriptionsTable
  RawBucketName:
    Value: !Ref RawBucket
