AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  컴공레이더 서버리스 백엔드 (AWS Academy Learner Lab용).
  Learner Lab은 IAM 역할을 새로 만들 수 없으므로 모든 Lambda가 미리 만들어진 LabRole을 씁니다.

Parameters:
  CrawlSchedule:
    Type: String
    Default: rate(1 hour)
    # 학교 게시판은 첫 쪽(10~20건)만 읽습니다. 바쁜 날은 하루 8건 넘게 올라와서 주기가 길면 글을 놓칩니다.
    # 30분보다 짧으면 사이트에 요청이 너무 잦아집니다. 범위를 넓히려면 수집기가 여러 쪽을 읽게 먼저 고쳐야 합니다.
    AllowedPattern: "^rate\\((([3-9][0-9]|1[0-7][0-9]|180) minutes|1 hour|[23] hours)\\)$"
    ConstraintDescription: "rate(30 minutes) ~ rate(3 hours) 사이로 정해 주세요 (예: rate(30 minutes), rate(1 hour), rate(2 hours))"
    Description: 크롤러 실행 주기. 30분~3시간 (예 rate(30 minutes), rate(1 hour))
  DiscordClientId:
    Type: String
    Description: 디스코드 개발자 포털 → OAuth2의 Client ID
  DiscordClientSecret:
    Type: String
    NoEcho: true
    Description: 디스코드 개발자 포털 → OAuth2의 Client Secret (배포할 때만 넘기고 파일에 적지 않습니다)
  DiscordBotToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: 디스코드 개발자 포털 → Bot의 Token. 새 글 DM 알림에 씁니다 (비워 두면 알림 꺼짐, 파일에 적지 않습니다)
  DiscordGuildId:
    Type: String
    Default: ""
    Description: 새 글을 올릴 디스코드 서버 ID. 봇 토큰과 함께 있어야 채널 게시가 켜집니다 (비워 두면 꺼짐)
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Google AI Studio에서 발급한 Gemini API 키. 새 글 AI 요약에 씁니다 (비워 두면 요약 꺼짐, 파일에 적지 않습니다)
  GeminiModel:
    Type: String
    Default: gemini-flash-lite-latest
    Description: 요약에 쓸 Gemini 모델 이름
  WebOrigin:
    Type: String
    Default: http://localhost:8765
    Description: 웹이 열리는 주소. 로그인 후 여기로 돌아옵니다 (끝에 / 없이)

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 256
    Timeout: 60
    Environment:
      Variables:
        ITEMS_TABLE: !Ref ItemsTable
        SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
        SEEN_TABLE: !Ref SeenTable
        RAW_BUCKET: !Ref RawBucket
  HttpApi:
    CorsConfiguration:
      AllowOrigins: ["*"]
      AllowMethods: [GET, PUT, DELETE, OPTIONS]
      AllowHeaders: [Content-Type, Authorization]
    Auth:
      Authorizers:
        CognitoAuth:                           # 로그인이 필요한 경로에만 붙입니다 (GET /items는 공개)
          IdentitySource: $request.header.Authorization
          JwtConfiguration:
            issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
            audience:
              - !Ref UserPoolClient

Resources:
  # ── 저장소 ─────────────────────────────────────────────
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: category, AttributeType: S }
        - { AttributeName: date, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: category-date-index      # 카테고리별 최신순 조회
          KeySchema:
            - { AttributeName: category, KeyType: HASH }
            - { AttributeName: date, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: keyword, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: keyword, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: keyword-index            # 이 키워드를 구독한 사용자 찾기
          KeySchema:
            - { AttributeName: keyword, KeyType: HASH }
            - { AttributeName: userId, KeyType: RANGE }
          Projection: { ProjectionType: KEYS_ONLY }

  SeenTable:
    Type: AWS::DynamoDB::Table                 # 사이트 간 중복 비교용 키 (crawler/src/dedupe.py)
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: seenKey, AttributeType: S }
      KeySchema:
        - { AttributeName: seenKey, KeyType: HASH }
      TimeToLiveSpecification:                 # expiresAt(초 단위 시각)이 지난 키는 DynamoDB가 지웁니다
        AttributeName: expiresAt
        Enabled: true

  RawBucket:
    Type: AWS::S3::Bucket                      # 원문 HTML 백업
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ── 크롤러 (EventBridge가 주기 실행) ──────────────────
  CrawlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-crawler"
      CodeUri: ../crawler/src
      Handler: handler.lambda_handler
      Timeout: 300
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          DISCORD_BOT_TOKEN: !Ref DiscordBotToken   # 새 글 DM 알림 (crawler/src/notify.py)
          DISCORD_GUILD_ID: !Ref DiscordGuildId     # 새 글 채널 게시 (crawler/src/channels.py)
          GEMINI_API_KEY: !Ref GeminiApiKey         # 새 글 AI 요약 (crawler/src/summarize.py)
          GEMINI_MODEL: !Ref GeminiModel
      Events:
        Schedule:
          Type: Schedule                       # EventBridge 규칙 (역할 생성 불필요)
          Properties:
            Schedule: !Ref CrawlSchedule

  # ── 웹이 쓰는 목록 API: GET /items ─────────────────────
  ItemsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-items-api"
      CodeUri: ../api/src
      Handler: items.lambda_handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        ListItems:
          Type: HttpApi
          Properties:
            Path: /items
            Method: GET

  # ── 로그인: Cognito User Pool + 디스코드(OIDC) + 이메일 회원가입 ─────────
  # User Pool은 IAM 역할이 필요 없어서 Learner Lab에서도 만들 수 있습니다.
  # 이메일 가입자는 사용자 이름이 이메일 주소(소문자)이고, 디스코드 사용자는 "Discord_<ID>"입니다.
  # 아래 설정은 모두 기존 User Pool을 그대로 둔 채 바꿀 수 있는 항목이라 이미 가입한 사용자는 유지됩니다.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AutoVerifiedAttributes: [email]          # 가입하면 인증 코드를 메일로 보냄 (Cognito 기본 발신, 하루 50통)
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireNumbers: true
          RequireLowercase: false
          RequireUppercase: false
          RequireSymbols: false
      AccountRecoverySetting:                  # 비밀번호 찾기: 인증된 이메일로 코드 받기
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: "[컴공레이더] 인증 코드"
        EmailMessage: "컴공레이더 인증 코드는 {####} 입니다. 화면에 입력해 주세요."

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain         # 로그인 주소: https://<Domain>.auth.<리전>.amazoncognito.com
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "${AWS::StackName}-${AWS::AccountId}"

  DiscordProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Discord
      ProviderType: OIDC
      ProviderDetails:
        client_id: !Ref DiscordClientId
        client_secret: !Ref DiscordClientSecret
        oidc_issuer: https://discord.com       # /.well-known/openid-configuration을 Cognito가 읽어 갑니다
        authorize_scopes: openid identify
        attributes_request_method: GET
      AttributeMapping:
        username: sub                          # 디스코드 사용자 ID → Cognito 사용자 이름 "discord_<ID>"
        preferred_username: preferred_username

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: DiscordProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false                    # 브라우저에서 쓰므로 비밀 값 없이 PKCE로 로그인
      SupportedIdentityProviders: [Discord, COGNITO]  # 디스코드 + 이메일 가입자
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, profile]
      # 이메일 로그인은 웹 화면에서 Cognito API(InitiateAuth)를 직접 부릅니다. 비밀번호는 HTTPS로 Cognito에만 갑니다.
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED      # 로그인 실패 때 "없는 계정"인지 드러내지 않기
      CallbackURLs:
        - !Sub "${WebOrigin}/"
      LogoutURLs:
        - !Sub "${WebOrigin}/"

  # ── 로그인한 사용자의 키워드 구독: /me/subscriptions ───
  MeApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-me-api"
      CodeUri: ../api/src
      Handler: me.lambda_handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        ListSubscriptions:
          Type: HttpApi
          Properties:
            Path: /me/subscriptions
            Method: GET
            Auth: { Authorizer: CognitoAuth }
        AddSubscription:
          Type: HttpApi
          Properties:
            Path: /me/subscriptions
            Method: PUT
            Auth: { Authorizer: CognitoAuth }
        RemoveSubscription:
          Type: HttpApi
          Properties:
            Path: /me/subscriptions
            Method: DELETE
            Auth: { Authorizer: CognitoAuth }

Outputs:
  ApiUrl:
    Description: web/js/api.js의 API_BASE에 넣을 주소
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  AuthUrl:
    Description: web/js/api.js의 AUTH_BASE에 넣을 주소
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  AuthClientId:
    Description: web/js/api.js의 AUTH_CLIENT_ID에 넣을 값
    Value: !Ref UserPoolClient
  DiscordRedirectUri:
    Description: 디스코드 개발자 포털 → OAuth2 → Redirects에 등록할 주소
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
  ItemsTableName:
    Value: !Ref ItemsTable
  SubscriptionsTableName:
    Value: !Ref SubscriptionsTable
  SeenTableName:
    Value: !Ref SeenTable
  RawBucketName:
    Value: !Ref RawBucket
