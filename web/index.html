<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>컴공레이더</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 저장해 둔 테마가 있으면 화면이 그려지기 전에 적용 (기본은 밝은 화면)
    try { if (localStorage.getItem('csradar.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#all"><span class="logo-dot" aria-hidden="true"></span>컴공레이더</a>
      <label class="search">
        <span class="sr-only">검색</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="제목, 학교, 회사 검색" autocomplete="off">
      </label>
      <a class="saved-link" href="#saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4.5L5 21V4.5a1 1 0 0 1 1-1z"/></svg><span class="saved-text">북마크</span> <span id="savedCount" class="count">0</span></a>
      <div class="auth-box" id="authBox"></div>
      <button class="theme-btn" type="button" id="themeBtn" aria-label="어두운 화면으로 전환">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </div>
    <nav class="tabs" aria-label="카테고리">
      <div class="tabs-inner" id="tabs"></div>
    </nav>
  </header>

  <main class="layout">
    <section class="feed" aria-labelledby="feedTitle">
      <div class="feed-head">
        <h1 id="feedTitle">전체</h1>
        <p id="feedDesc" class="muted"></p>
      </div>

      <div class="filters">
        <div class="filter-row" id="subtypeRow" hidden>
          <span class="filter-label" id="subtypeLabel">구분</span>
          <div class="chips" id="subtypeChips"></div>
        </div>
        <div class="filter-row">
          <span class="filter-label">분야</span>
          <div class="chips" id="fieldChips"></div>
        </div>
      </div>

      <div class="list-bar">
        <span id="resultCount" class="muted"></span>
        <label class="sort">
          <span class="sr-only">정렬</span>
          <select id="sort">
            <option value="latest">최신순</option>
            <option value="deadline">마감 임박순</option>
          </select>
        </label>
      </div>

      <ul class="list" id="list"></ul>
      <div class="empty" id="empty" hidden>
        <p><b>조건에 맞는 글이 없어요.</b></p>
        <p class="muted">분야 필터를 줄이거나 검색어를 바꿔 보세요.</p>
        <button class="btn" type="button" id="resetBtn">필터 초기화</button>
      </div>
    </section>

    <aside class="rail">
      <section class="panel subs-panel">
        <h2>키워드 알림</h2>
        <div id="subsBody"></div>
      </section>
      <section class="panel">
        <h2>마감 임박</h2>
        <ol class="deadline-list" id="deadlineList"></ol>
      </section>
      <section class="panel">
        <h2>오늘의 GitHub 트렌딩</h2>
        <ol class="repo-list" id="repoList"></ol>
      </section>
      <p class="note">지금 보이는 글은 예시 데이터예요. 크롤러와 API를 연결하면 실제 글로 바뀝니다.</p>
    </aside>
  </main>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
